<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenKingdom</title>
</head>
<style>
    body {
        color: rgb(47, 71, 59);
    }

    #banner {
        position: fixed;
        width: 100%;
        height: 40px;
        background-color: rgb(47, 71, 59);
        margin-bottom: 10px;
        top: 0px;
        left: 0px;
        right: 0px;
        z-index: 1000;
    }

    #plants_win {
        position: absolute;
        left: 90px;
        margin: auto;
        height: 600px;
        margin-top: 80px;
    }

    #name {
        float: left;
        font-size: 18px;
        padding: 10px;
        padding-left: 20px;
        line-height: 18px;
        color: white;
        height: 16px;
        text-align: center;
    }

    #item_num {
        float: right;
        font-size: 18px;
        padding: 8px;
        line-height: 18px;
        padding-bottom: 16px;
        color: white;
        width: 16px;
        height: 16px;
        text-align: center;
        cursor: pointer;
    }

    #cart {
        font-weight: 900;
        float: right;
        width: 15px;
        margin-right: 0px;
        padding-top: 10px;
        padding-left: 10px;
        padding-bottom: 14px;
        cursor: pointer;
    }

    #talk {
        font-weight: 900;
        position: absolute;
        right: 64px;
        width: 15px;
        margin-right: 0px;
        padding-top: 10px;
        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 14px;
        cursor: pointer;
    }

    .plants_img {
        width: 200px;
        margin: 3px;
    }

    .plants_text {
        width: 200px;
        font-size: 20px;
        padding: 5px;
        text-align: justify;
    }

    .plants_price {
        font-size: 20px;
        padding: 5px;
        width: 100px;
        float: left;
    }

    .plants_item {
        margin: 10px;
        border: 1px solid rgb(47, 71, 59);
        overflow: auto;
        width: 210px;
        padding: 8px;
        border-radius: 5px;
        float: left;
        font-size: 30px;
        cursor: pointer;
    }

    .plants_item:hover {
        background-color: rgba(47, 71, 59, 0.475);
    }

    .plants_cart {
        margin-top: 4px;
        font-size: 20px;
        float: right;
        cursor: pointer;
    }

    .plants_cart:hover {
        font-size: 30px;
    }

    #cart_win {
        position: fixed;
        top: 40px;
        right: 0px;
        border: 1px solid white;
        padding: 10px;
        background-color: rgb(168, 163, 156);
        display: none;
        border-radius: 8px;
        box-shadow: 10px 10px 20px rgb(0, 0, 0, 0.5);
        width: 360px;
        padding-top: 30px;
    }

    #cart_win_close {
        position: absolute;
        top: 0px;
        left: 354px;
        padding: 2px;
        border: 1px solid gray;
        margin: 4px;
        border-radius: 4px;
        cursor: pointer;
    }

    #login_win_close {
        position: absolute;
        top: 0px;
        left: 284px;
        padding: 2px;
        border: 1px solid gray;
        margin: 4px;
        border-radius: 4px;
        cursor: pointer;
    }

    #talk_win_close {
        position: absolute;
        top: 0px;
        left: 394px;
        padding: 2px;
        border: 1px solid gray;
        margin: 4px;
        border-radius: 4px;
        cursor: pointer;
    }

    .cart_item {
        width: 360px;
        overflow: auto;
        margin: 3px;
    }

    .cart_img {
        width: 60px;
        float: left;
        margin-right: 10px;
    }

    .cart_text {
        float: left;
        width: 280px;
        letter-spacing: 2px;
        margin-top: 4px;
    }

    .cart_price {
        width: 100px;
        float: left;
        letter-spacing: 2px;
    }

    .cart_delete {
        float: left;
        border: 1px solid transparent;
        cursor: pointer;
    }

    .cart_delete:hover {
        border: 1px solid rgba(255, 0, 0, 0.5);
        border-radius: 4px;
    }

    .login {
        position: absolute;
        right: 100px;
        float: right;
        font-size: 18px;
        padding: 8px;
        padding-top: 4px;
        padding-bottom: 12px;
        color: white;
        width: 16px;
        height: 24px;
        padding-right: 40px;
        cursor: pointer;
    }

    .login_success {
        position: absolute;
        right: 100px;
        float: right;
        font-size: 18px;
        padding: 8px;
        padding-top: 6px;
        padding-bottom: 12px;
        color: white;
        height: 24px;
        padding-right: 10px;
        cursor: pointer;
        margin-right: 5px;
        ;
    }

    #plants_imgshow {
        position: relative;
        margin: auto;
        overflow: hidden;
        height: 400px;
        width: 900px;
        top: 52px;
    }

    #plants_imgshow img {

        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: none;
    }

    .bigimg {
        width: 80%;
    }

    .showmore_win img {
        height: 100px;
        width: 100px;
    }

    #login_win {
        position: fixed;
        top: 40px;
        right: 0px;
        border: 1px solid white;
        padding: 10px;
        background-color: rgb(168, 163, 156);
        display: none;
        border-radius: 8px;
        box-shadow: 10px 10px 20px rgb(0, 0, 0, 0.5);
        width: 290px;
        padding-top: 30px;
    }

    #talk_win {
        position: fixed;
        top: 40px;
        right: 0px;
        border: 1px solid white;
        padding: 10px;
        background-color: rgb(168, 163, 156);
        display: none;
        border-radius: 8px;
        box-shadow: 10px 10px 20px rgb(0, 0, 0, 0.5);
        width: 400px;
        padding-top: 30px;
    }

    #hr1 {
        display: none;
    }

    #login_win p {
        margin: 0px;
    }

    #login_win h1 {
        margin: 0px;
    }

    #notice {
        color: rgb(151, 46, 46);
    }

    .reply {
        float: right;
    }
</style>

<link href="_css/jquery-ui.min.css" rel="stylesheet">
<script src="_js/jquery.min.js"></script>
<script src="_js/jquery-ui.min.js"></script>
<link rel="stylesheet" href="fontawesome-free-6.4.0-web/css/all.css">
<script src="./greenkingdom.js"></script>

</head>

<body>

    <div id="banner">
        <div id="name">Green Kingdom</div>
        <div id="item_num">0</div>
        <i class="fa-regular fa-comment-dots" id="talk" style="color: #ffffff;"></i>
        <i class="fa-regular fa-cart-shopping plants" id="cart" style="color: #ffffff;"></i>
        <div class="login" id="login">Login</div>
    </div>

    <div id="plants_imgshow">
        <img class="bigimg" src="./images/bigimg_1.png" alt="">
        <img class="bigimg" src="./images/bigimg_2.png" alt="">
        <img class="bigimg" src="./images/bigimg_3.png" alt="">
        <img class="bigimg" src="./images/bigimg_4.png" alt="">
        <img class="bigimg" src="./images/bigimg_5.png" alt="">
        <img class="bigimg" src="./images/bigimg_6.png" alt="">
        <img class="bigimg" src="./images/bigimg_7.png" alt="">
        <img class="bigimg" src="./images/bigimg_8.png" alt="">
        <img class="bigimg" src="./images/bigimg_9.png" alt="">
        <img class="bigimg" src="./images/bigimg_10.png" alt="">
    </div>

    <div id="plants_win">
    </div>

    <div id="showmore_win_container">
    </div>

    <div id="cart_win">
        <div id="cart_win_close">X</div>
        <div id="total"></div>
    </div>

    <div id="login_win">
        <div id="login_win_close">X</div>
        <p>account</p>
        <input type="text" name="account" placeholder="email or phone" value="" id="account">
        <p>password</p>
        <input type="password" name="password" value="" id="password">
        <br>
        <br>
        <button id="login_btn">登入</button>
    </div>

    <div id="talk_win">
        <div id="talk_win_close">X</div>
        <H2>Planting Problem</H2>
        <div id="history"></div>
        <input type="text" name="problem" id="problem" value="">
        <button id="send">send</button>
    </div>
</body>

</html>
